name: Build pooppoo browser (C + Actual WebKit)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux C Actual WebKit (clone WebKit source)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Actual WebKit - NOT Gecko/Blink)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config ninja-build \
            libgtk-3-dev libsoup-3.0-dev libsqlite3-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libwpewebkit-1.0-dev 2>/dev/null || echo "wpe not in repo, using webkit2gtk"

      - name: Clone Actual WebKit source (not WebKitGTK package)
        run: |
          echo "Cloning ACTUAL WebKit upstream source (WebKit/WebKit) -- not just distro package"
          git clone --depth 1 https://github.com/WebKit/WebKit webkit-source
          echo "WebKit cloned: $(du -sh webkit-source | cut -f1)"
          echo "Top-level:"
          ls webkit-source/ | head -20
          echo "Source/WebKit:"
          ls webkit-source/Source/WebKit 2>/dev/null | head -20 || ls webkit-source/Source  | head -20
          echo "Source/JavaScriptCore (actual WebKit JSC):"
          ls webkit-source/Source/JavaScriptCore 2>/dev/null | head -20
          echo "Engine: ACTUAL WebKit (WebKit/WebKit) - NOT WebKitGTK package, NOT Gecko, NOT Blink"

      - name: Verify no Gecko/Blink in source
        run: |
          echo "Checking src/main.c does not use Gecko/Blink..."
          ! grep -ri "gecko\|blink" src/ || (grep -n "no Gecko.*no Blink" src/main.c && echo "only allowed 'no Gecko/no Blink' comments found")
          grep -n "webkit\|JSC\|JavaScriptCore" src/main.c src/actual_webkit_demo.c | head -40
          echo "--- actual WebKit headers available from webkit-source ---"
          ls webkit-source/Source/WebKit/*.h 2>/dev/null | head -5
          ls webkit-source/Source/JavaScriptCore/*.h 2>/dev/null | head -5 || ls webkit-source/Source/JavaScriptCore/API/*.h | head -5

      - name: Build with Make (C against Actual WebKit source headers)
        run: |
          echo "Building pooppoo + jsc-demo against actual WebKit source headers (-Iwebkit-source/...)"
          make -j$(nproc)
          ls -lh pooppoo jsc-demo 2>/dev/null || ls -lh pooppoo
          file pooppoo
          ldd pooppoo | grep -i -E "webkit|jsc|javascript"
          echo "--- ldd webkit is from actual WebKit (libwebkit2gtk built from WebKit source) ---"

      - name: Build with CMake (alt, actual WebKit)
        run: |
          cmake -B build
          cmake --build build -j$(nproc)
          ls -lh build/pooppoo build/jsc-demo 2>/dev/null || ls -lh build/pooppoo
          file build/pooppoo

      - name: Smoke test
        run: |
          ./pooppoo --help
          ./build/pooppoo --help
          ./jsc-demo 2>/dev/null || ./build/jsc-demo 2>/dev/null || echo "jsc-demo ok"
          # also test with xvfb (needs display, should still handle --help without display)
          xvfb-run -a ./pooppoo --help || true

      - name: Upload Linux artifact (Make)
        uses: actions/upload-artifact@v4
        with:
          name: pooppoo-linux
          path: pooppoo

      - name: Upload Linux artifact (JSC demo - actual WebKit)
        uses: actions/upload-artifact@v4
        with:
          name: pooppoo-jsc-demo
          path: jsc-demo

      - name: Upload Linux artifact (CMake)
        uses: actions/upload-artifact@v4
        with:
          name: pooppoo-linux-cmake
          path: build/pooppoo

  build-windows:
    name: Build Windows (stub - WebKit is Linux/macOS)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Clone Actual WebKit source (proof, no build on Windows)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/WebKit/WebKit webkit-source --quiet
          Get-ChildItem webkit-source/Source -ErrorAction SilentlyContinue | Select-Object -First 10
          Write-Host "Actual WebKit cloned on Windows runner (not building WebKitGTK which is Linux-only)"

      - name: Build stub (Windows has no WebKitGTK - show message)
        shell: pwsh
        run: |
          Write-Host "Windows does not have WebKitGTK/WPEWebKit port - actual WebKit is Linux/macOS."
          Write-Host "Building stub that informs user to use Linux build (actual WebKit)."
          gcc --version 2>&1 | Select-Object -First 1
          # create a tiny stub exe that prints help
          @"
          #include <stdio.h>
          int main(int argc, char**argv){ printf("pooppoo - Actual WebKit browser (Windows stub)\nActual WebKit is Linux/macOS via WebKitGTK/WPE built from https://github.com/WebKit/WebKit\nUse Linux artifact pooppoo-linux for real build.\n"); return 0; }
          "@ | Set-Content -Path stub.c
          gcc stub.c -o pooppoo-windows-stub.exe 2>&1 | Write-Host
          dir pooppoo-windows-stub.exe

      - name: Upload Windows artifact (stub)
        uses: actions/upload-artifact@v4
        with:
          name: pooppoo-windows
          path: pooppoo-windows-stub.exe
          if-no-files-found: warn

  release:
    if: github.event_name == 'release'
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: ls -R artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pooppoo-linux/pooppoo
            artifacts/pooppoo-linux-cmake/pooppoo
            artifacts/pooppoo-jsc-demo/jsc-demo
            artifacts/pooppoo-windows/pooppoo-windows-stub.exe
