name: Build pooppoo browser

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux (WebKitGTK)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (WebKitGTK - NOT Gecko/Blink)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 libwebkit2gtk-4.1-dev \
            libcairo2-dev pkg-config libgirepository1.0-dev gobject-introspection \
            python3-pip python3-pil

      - name: Install Python deps (Linux - system python, no hosted)
        run: |
          python3 -m pip install --upgrade pip --break-system-packages
          python3 -m pip install --break-system-packages requests beautifulsoup4 pyinstaller pillow
          python3 -c "import gi; print('gi ok')"
          pkg-config --modversion girepository-2.0 || (find /usr -name 'girepository*.pc' 2>/dev/null; echo 'no girepository pc found')

      - name: Sanity check WebKit import (system python)
        run: |
          python3 -c "import gi; gi.require_version('Gtk','3.0'); gi.require_version('WebKit2','4.1'); from gi.repository import WebKit2; print('WebKit2 OK:', WebKit2.MAJOR_VERSION)"

      - name: Build with PyInstaller (Linux - system python)
        run: |
          python3 -m PyInstaller --noconfirm --onefile --windowed --name pooppoo --hidden-import=gi --hidden-import=gi.repository.Gtk --hidden-import=gi.repository.WebKit2 --collect-all gi --add-data "assets:assets" src/pooppoo/__main__.py
          ls -lh dist/

      - name: Smoke test (toy engine path ok)
        run: |
          ./dist/pooppoo --help || true
          python3 src/pooppoo/__main__.py --help

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: pooppoo-linux
          path: dist/pooppoo

  build-windows:
    name: Build Windows (Toy fallback + WebKit if available)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps (Windows - toy fallback only, no PyGObject)
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pyinstaller pillow

      - name: Build with PyInstaller (Windows)
        run: |
          pyinstaller --noconfirm --onefile --windowed --name pooppoo --hidden-import=bs4 --hidden-import=requests --add-data "assets;assets" src/pooppoo/__main__.py
          dir dist

      - name: Smoke test
        run: |
          .\dist\pooppoo.exe --help
          python src/pooppoo/__main__.py --help

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pooppoo-windows
          path: dist/pooppoo.exe

  release:
    if: github.event_name == 'release'
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show artifacts
        run: ls -R artifacts

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pooppoo-linux/pooppoo
            artifacts/pooppoo-windows/pooppoo.exe
